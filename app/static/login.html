<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ticket Router — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12151B;
    --panel: #1A1E26;
    --panel-2: #20242E;
    --border: #2B303B;
    --text: #E7EAEE;
    --muted: #8B93A1;
    --accent: #3ED9C4;
    --coral: #E8604C;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); line-height:1.5;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .card{
    width:100%; max-width:360px; margin:0 20px;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:28px;
  }
  h1{
    display:flex; align-items:baseline; gap:8px;
    font-family:var(--mono); font-size:15px; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase; margin:0 0 22px;
  }
  .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
  label.field-label{
    display:block; font-family:var(--mono); font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;
  }
  .field{ margin-bottom:16px; }
  input[type=text], input[type=password]{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--sans); font-size:14px; padding:10px 12px;
  }
  input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  button{
    width:100%; font-family:var(--mono); font-size:12px; letter-spacing:.04em; text-transform:uppercase;
    background:var(--accent); color:#0B1411; border:none; border-radius:6px;
    padding:11px 16px; cursor:pointer; font-weight:600; margin-top:6px;
  }
  button:hover{ filter:brightness(1.08); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .error{ font-family:var(--mono); font-size:12px; color:var(--coral); min-height:16px; margin-top:12px; text-align:center; }
</style>
</head>
<body>
<div class="card">
  <h1><span class="dot"></span>Ticket Router</h1>
  <form id="loginForm">
    <div class="field">
      <label class="field-label">Username</label>
      <input type="text" id="username" autocomplete="username" autofocus />
    </div>
    <div class="field">
      <label class="field-label">Password</label>
      <input type="password" id="password" autocomplete="current-password" />
    </div>
    <button type="submit" id="submitBtn">Sign in</button>
    <div class="error" id="errorMsg"></div>
  </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errorMsg');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { err.innerText = 'enter both fields'; return; }
  btn.disabled = true; err.innerText = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || 'login failed');
    }
    window.location = '/';
  } catch (e) {
    err.innerText = e.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
