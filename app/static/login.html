<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ticket Router — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #4A1524;
    --panel: #FFFFFF;
    --panel-2: #F6EFE8;
    --border: #E7DED4;
    --text: #241318;
    --muted: #756169; /* darkened from #8B7680 - failed WCAG AA contrast (4.20:1 on white); this passes 5.7:1 */
    --accent: #7A2039;
    --accent-ink: #FFFFFF;
    --coral: #C0392B;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;

    /* Same governed type scale as the main app (index.html) */
    --fs-xs: 11px;
    --fs-sm: 12px;
    --fs-md: 13px;
    --fs-base: 14px;

    color-scheme: light dark;
  }
  /* Dark Mode - follows the OS/browser preference automatically. Values
     match app/static/index.html's dark palette (checked against WCAG AA
     with a contrast calculator, not eyeballed) - --bg (the page backdrop
     behind the card) stays as-is since it's already dark-toned. */
  @media (prefers-color-scheme: dark){
    :root{
      --panel: #241620;
      --panel-2: #2E1B24;
      --border: #43293A;
      --text: #F3E9E4;
      --muted: #C9AFBA;
      --accent: #E0577A;
      --accent-ink: #1B1013;
      --coral: #CC4E42;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); line-height:1.5;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .card{
    width:100%; max-width:360px; margin:0 20px;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:28px; box-shadow:0 8px 30px rgba(0,0,0,.25);
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .logo-badge{
    width:28px; height:28px; border-radius:8px; background:var(--coral);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    color:#fff; font-family:var(--mono); font-weight:700; font-size:var(--fs-md);
  }
  .brand-name{ font-family:var(--mono); font-weight:600; font-size:var(--fs-base); letter-spacing:.06em; }
  h1{
    font-family:var(--sans); font-size:var(--fs-base); font-weight:600; color:var(--muted);
    margin:0 0 22px;
  }
  label.field-label{
    display:block; font-family:var(--mono); font-size:var(--fs-xs); color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;
  }
  .field{ margin-bottom:16px; }
  input[type=text], input[type=password]{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--sans); font-size:var(--fs-base); padding:10px 12px;
  }
  input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  button{
    width:100%; font-family:var(--sans); font-size:var(--fs-md); font-weight:600;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:6px;
    padding:11px 16px; cursor:pointer; margin-top:6px;
  }
  button:hover{ filter:brightness(1.1); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .error{ font-family:var(--mono); font-size:var(--fs-sm); color:var(--coral); min-height:16px; margin-top:12px; text-align:center; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo-badge">N</div>
    <span class="brand-name">NIAT</span>
  </div>
  <h1>Ticket Router</h1>
  <form id="loginForm">
    <div class="field">
      <label class="field-label">Username</label>
      <input type="text" id="username" autocomplete="username" autofocus />
    </div>
    <div class="field">
      <label class="field-label">Password</label>
      <input type="password" id="password" autocomplete="current-password" />
    </div>
    <button type="submit" id="submitBtn">Sign in</button>
    <div class="error" id="errorMsg"></div>
  </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errorMsg');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { err.innerText = 'enter both fields'; return; }
  btn.disabled = true; err.innerText = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || 'login failed');
    }
    window.location = '/';
  } catch (e) {
    err.innerText = e.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
