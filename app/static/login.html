<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ticket Router — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #4A1524;
    --panel: #FFFFFF;
    --panel-2: #F6EFE8;
    --border: #E7DED4;
    --text: #241318;
    --muted: #8B7680;
    --accent: #7A2039;
    --accent-ink: #FFFFFF;
    --coral: #C0392B;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); line-height:1.5;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .card{
    width:100%; max-width:360px; margin:0 20px;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:28px; box-shadow:0 8px 30px rgba(0,0,0,.25);
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .logo-badge{
    width:28px; height:28px; border-radius:8px; background:var(--coral);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    color:#fff; font-family:var(--mono); font-weight:700; font-size:13px;
  }
  .brand-name{ font-family:var(--mono); font-weight:600; font-size:14px; letter-spacing:.06em; }
  h1{
    font-family:var(--sans); font-size:15px; font-weight:600; color:var(--muted);
    margin:0 0 22px;
  }
  label.field-label{
    display:block; font-family:var(--mono); font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;
  }
  .field{ margin-bottom:16px; }
  input[type=text], input[type=password]{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--sans); font-size:14px; padding:10px 12px;
  }
  input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  button{
    width:100%; font-family:var(--sans); font-size:13px; font-weight:600;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:6px;
    padding:11px 16px; cursor:pointer; margin-top:6px;
  }
  button:hover{ filter:brightness(1.1); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .error{ font-family:var(--mono); font-size:12px; color:var(--coral); min-height:16px; margin-top:12px; text-align:center; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo-badge">N</div>
    <span class="brand-name">NIAT</span>
  </div>
  <h1>Ticket Router</h1>
  <form id="loginForm">
    <div class="field">
      <label class="field-label">Username</label>
      <input type="text" id="username" autocomplete="username" autofocus />
    </div>
    <div class="field">
      <label class="field-label">Password</label>
      <input type="password" id="password" autocomplete="current-password" />
    </div>
    <button type="submit" id="submitBtn">Sign in</button>
    <div class="error" id="errorMsg"></div>
  </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errorMsg');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { err.innerText = 'enter both fields'; return; }
  btn.disabled = true; err.innerText = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || 'login failed');
    }
    window.location = '/';
  } catch (e) {
    err.innerText = e.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
