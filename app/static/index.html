<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ticket Router</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12151B;
    --panel: #1A1E26;
    --panel-2: #20242E;
    --border: #2B303B;
    --text: #E7EAEE;
    --muted: #8B93A1;
    --accent: #3ED9C4;
    --amber: #F0A857;
    --coral: #E8604C;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); line-height:1.5;
    min-height:100vh;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:40px 20px 80px; }

  .masthead{
    display:flex; align-items:flex-start; justify-content:space-between;
    border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:28px;
  }
  .masthead h1{
    font-family:var(--mono); font-size:15px; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase; margin:0;
  }
  .masthead .sub{ font-family:var(--mono); font-size:12px; color:var(--muted); }
  .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:6px; box-shadow:0 0 8px var(--accent); }

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:20px; margin-bottom:20px;
  }
  label.field-label{
    display:block; font-family:var(--mono); font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;
  }
  textarea{
    width:100%; min-height:88px; resize:vertical;
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--sans); font-size:14px; padding:12px;
  }
  textarea:focus, input:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  button{
    font-family:var(--mono); font-size:12px; letter-spacing:.04em; text-transform:uppercase;
    background:var(--accent); color:#0B1411; border:none; border-radius:6px;
    padding:10px 16px; cursor:pointer; font-weight:600;
  }
  button:hover{ filter:brightness(1.08); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  button.secondary{ background:transparent; border:1px solid var(--border); color:var(--text); }

  .row{ display:flex; gap:10px; align-items:center; margin-top:12px; }

  .log{ display:flex; flex-direction:column; gap:14px; }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px;
  }
  .card .ticket-id{ font-family:var(--mono); font-size:11px; color:var(--muted); }
  .card .ticket-text{ margin:6px 0 12px; font-size:14px; }

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    padding:4px 9px; border-radius:20px; border:1px solid var(--border); background:var(--panel-2);
  }
  .badge .swatch{ width:7px; height:7px; border-radius:50%; }

  .meter{ display:flex; gap:3px; margin:10px 0 4px; }
  .meter i{ flex:1; height:6px; border-radius:2px; background:var(--panel-2); }
  .meter i.on{ background:var(--seg-color, var(--accent)); }
  .conf-label{ font-family:var(--mono); font-size:11px; color:var(--muted); }

  .reasoning{ font-size:13px; color:var(--muted); margin-top:10px; }

  .group-label{ font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  .routing{
    display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; padding:10px 12px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    font-size:12px;
  }
  .routing div b{ color:var(--muted); font-weight:500; font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:2px; }

  .clarify{
    margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);
  }
  .clarify .q{ font-size:14px; margin-bottom:8px; }
  .clarify input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--sans); font-size:14px; padding:10px 12px; margin-bottom:8px;
  }

  .correction{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); }
  .correction select{
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--sans); font-size:13px; padding:8px 10px;
  }
  .status-line{ font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:2px; }
  .empty{ color:var(--muted); font-size:13px; font-family:var(--mono); text-align:center; padding:30px 0; }
  .thread{ margin:10px 0; font-size:13px; color:var(--muted); }
  .thread .qa{ margin-bottom:4px; }

  .key-panel input[type=password], .key-panel input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--mono); font-size:13px; padding:10px 12px;
  }
  .key-hint{ font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:8px; }
  .key-panel.saved{ border-color:var(--accent); }
  a.download-link{
    font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--text); text-decoration:none; border:1px solid var(--border); border-radius:6px;
    padding:8px 14px; background:var(--panel);
  }
  a.download-link:hover{ border-color:var(--accent); color:var(--accent); }

  .masthead-right{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
  .masthead-tools{ display:flex; align-items:center; gap:10px; }
  #zohoStatusBadge{ cursor:help; }

  .daily-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .daily-bar .left{ display:flex; align-items:center; gap:10px; }
  .daily-bar select{
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--mono); font-size:12px; padding:8px 10px;
  }
  .daily-bar button{ padding:8px 12px; }

  .zoho-layout{ display:flex; gap:20px; }
  .zoho-issue-block{ flex:1.6; min-width:0; }
  .zoho-category-block{
    flex:1; min-width:0; padding-left:18px; border-left:1px dashed var(--border);
  }
  .issue-text{
    font-size:14px; margin:6px 0 10px; padding:10px 12px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
  }
  .ticket-id-line{ font-family:var(--mono); font-size:11px; color:var(--muted); }
  .ticket-id-line .mono{ color:var(--text); }
  .category-value{ font-size:14px; margin-bottom:2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1><span class="dot"></span>Ticket Router</h1>
    <div class="masthead-right">
      <div class="sub">classify &rarr; clarify &rarr; route &rarr; learn &middot; <a href="/zoho-debug" style="color:var(--muted);text-decoration:underline;">zoho raw data</a> &middot; <a href="#" id="logoutLink" onclick="logout(event)" style="color:var(--muted);text-decoration:underline;">log out</a></div>
      <div class="masthead-tools">
        <a class="download-link" href="/api/taxonomy/export.csv" download="taxonomy.csv">&darr; Taxonomy CSV</a>
        <span id="zohoStatusBadge" class="badge" title="Zoho credentials live in .env on the server (ZOHO_INVOKE_URL / ZOHO_API_KEY) - there is no in-browser control for them, same as the admin password.">zoho: checking…</span>
      </div>
    </div>
  </div>

  <div class="panel key-panel" id="keyPanel">
    <label class="field-label">OpenAI API key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off" />
    <div class="row">
      <button id="saveKeyBtn" onclick="saveApiKey()">Save key</button>
      <button class="secondary" id="clearKeyBtn" onclick="clearApiKey()">Clear</button>
      <span id="keyStatus" class="status-line"></span>
    </div>
    <div class="key-hint">Stored only in this browser's local storage, sent directly with each request - never written to the server.</div>
  </div>

  <div class="panel daily-bar">
    <div class="left">
      <label class="field-label" style="margin:0;">Day</label>
      <select id="dateSelect" onchange="onDateChange()"></select>
      <button class="secondary" onclick="loadDailyTickets()">Refresh</button>
    </div>
    <div id="dailySummary" class="status-line"></div>
  </div>

  <div id="log" class="log">
    <div class="empty">Loading today's tickets…</div>
  </div>
</div>

<script>
const API_KEY_STORAGE_KEY = 'ticketRouterOpenAIKey';
let groups = [];
let leafMap = {}; // subcategory id -> { name, groupId, groupName }
const log = document.getElementById('log');

function getApiKey() {
  return localStorage.getItem(API_KEY_STORAGE_KEY) || '';
}

function authHeaders() {
  const key = getApiKey();
  return key ? { 'X-OpenAI-Api-Key': key } : {};
}

function refreshKeyPanel() {
  const key = getApiKey();
  const panel = document.getElementById('keyPanel');
  const input = document.getElementById('apiKeyInput');
  if (key) {
    input.value = key;
    panel.classList.add('saved');
  } else {
    panel.classList.remove('saved');
  }
}

function saveApiKey() {
  const input = document.getElementById('apiKeyInput');
  const status = document.getElementById('keyStatus');
  const key = input.value.trim();
  if (!key) { status.innerText = 'enter a key first'; setTimeout(() => status.innerText = '', 2000); return; }
  localStorage.setItem(API_KEY_STORAGE_KEY, key);
  refreshKeyPanel();
  status.innerText = 'saved';
  setTimeout(() => status.innerText = '', 2000);
}

function clearApiKey() {
  localStorage.removeItem(API_KEY_STORAGE_KEY);
  document.getElementById('apiKeyInput').value = '';
  refreshKeyPanel();
}

refreshKeyPanel();

async function logout(e) {
  e.preventDefault();
  await fetch('/api/logout', { method: 'POST' });
  window.location = '/login';
}

async function loadTaxonomy() {
  const res = await fetch('/api/taxonomy');
  const data = await res.json();
  groups = data.categories;
  leafMap = {};
  groups.forEach(g => {
    (g.subcategories || []).forEach(s => {
      leafMap[s.id] = { name: s.name, groupId: g.id, groupName: g.name };
    });
  });
}

async function loadZohoStatus() {
  const el = document.getElementById('zohoStatusBadge');
  try {
    const res = await fetch('/api/zoho/status');
    if (!res.ok) throw new Error(`status ${res.status}`);
    const data = await res.json();
    const isSample = data.invoke_url_is_sample || data.api_key_is_sample;
    const color = isSample ? 'var(--amber)' : 'var(--accent)';
    const label = isSample ? 'zoho: sample/mock config' : 'zoho: configured';
    el.innerHTML = `<span class="swatch" style="background:${color}"></span>${label}`;
  } catch (e) {
    el.innerHTML = `<span class="swatch" style="background:var(--coral)"></span>zoho: status unknown`;
    console.error(e);
  }
}

function confBand(c) {
  if (c === null || c === undefined) return { color: 'var(--muted)', segs: 0 };
  if (c < 0.4) return { color: 'var(--coral)', segs: Math.max(1, Math.round(c * 5)) };
  if (c < 0.65) return { color: 'var(--amber)', segs: Math.round(c * 5) };
  return { color: 'var(--accent)', segs: Math.round(c * 5) };
}

function categoryName(id) {
  return leafMap[id] ? leafMap[id].name : id;
}

function renderMeter(confidence) {
  const band = confBand(confidence);
  let segs = '';
  for (let i = 0; i < 5; i++) {
    segs += `<i class="${i < band.segs ? 'on' : ''}" style="--seg-color:${band.color}"></i>`;
  }
  return `<div class="meter">${segs}</div><div class="conf-label">confidence ${confidence !== null && confidence !== undefined ? confidence.toFixed(2) : '—'}</div>`;
}

function statusLabel(status) {
  return {
    classified: 'Routed',
    awaiting_clarification: 'Awaiting clarification',
    needs_human_review: 'Needs human review',
    corrected: 'Corrected',
  }[status] || status;
}

function categoryOptionsGrouped(selectedId) {
  return groups.map(g => {
    const opts = (g.subcategories || []).map(s =>
      `<option value="${s.id}" ${s.id === selectedId ? 'selected' : ''}>${esc(s.name)}</option>`
    ).join('');
    return `<optgroup label="${esc(g.name)}">${opts}</optgroup>`;
  }).join('');
}

function clarifyHTML(state) {
  return `
    <div class="clarify">
      <div class="q">${esc(state.clarifying_question || 'Could you provide more detail?')}</div>
      <input type="text" placeholder="Your answer..." />
      <button onclick="respond('${state.ticket_id}', this)">Send answer</button>
    </div>
  `;
}

function correctionHTML(state) {
  return `
    <div class="correction">
      <label class="field-label">Not right? Correct it</label>
      <select>${categoryOptionsGrouped(state.category_id)}</select>
      <button class="secondary" onclick="correct('${state.ticket_id}', this)">Submit correction</button>
    </div>
  `;
}

function zohoCardHTML(state) {
  const band = confBand(state.confidence);
  const showClarify = state.status === 'awaiting_clarification';
  const canCorrect = state.status === 'classified' || state.status === 'needs_human_review';

  const threadHTML = (state.conversation || []).map(t =>
    `<div class="qa">${t.role === 'system_question' ? '→ ' : '↳ '}${esc(t.content)}</div>`
  ).join('');

  return `
    <div class="zoho-layout">
      <div class="zoho-issue-block">
        <div class="field-label">Issue in Detail</div>
        <div class="issue-text">${esc(state.issue_in_detail || '(Zoho returned no issue text)')}</div>
        <div class="ticket-id-line">Ticket ID: <span class="mono">${esc(state.zoho_ticket_id)}</span> &middot; ${statusLabel(state.status)}</div>
      </div>
      <div class="zoho-category-block">
        ${state.category_id ? `
          <div class="field-label">Category</div>
          <div class="category-value">${esc(state.category_group_name || '—')}</div>
          <div class="field-label" style="margin-top:12px;">Sub-category</div>
          <span class="badge"><span class="swatch" style="background:${band.color}"></span>${esc(state.category_name || state.category_id)}</span>
          ${renderMeter(state.confidence)}
          ${state.reasoning ? `<div class="reasoning">${esc(state.reasoning)}</div>` : ''}
          ${(state.assigned_team || state.poc_primary) ? `
            <div class="routing">
              ${state.assigned_team ? `<div><b>Team</b>${esc(state.assigned_team)}</div>` : ''}
              ${state.poc_primary ? `<div><b>POC</b>${esc(state.poc_primary)}</div>` : ''}
            </div>
          ` : ''}
        ` : '<div class="reasoning">Not yet classified.</div>'}
        ${zohoAgreementHTML(state)}
      </div>
    </div>
    ${threadHTML ? `<div class="thread">${threadHTML}</div>` : ''}
    ${showClarify ? clarifyHTML(state) : ''}
    ${canCorrect ? correctionHTML(state) : ''}
  `;
}

function zohoAgreementHTML(state) {
  const zohoTag = state.zoho_subcategory || state.zoho_category;
  if (!zohoTag) return '';
  if (state.zoho_agrees === null || state.zoho_agrees === undefined) return '';
  const color = state.zoho_agrees ? 'var(--accent)' : 'var(--coral)';
  const label = state.zoho_agrees ? 'matches Zoho tag' : 'differs from Zoho tag';
  return `
    <div class="routing" style="margin-top:8px;">
      <div><b>Zoho tag</b>${esc(zohoTag)}</div>
      <div><b>Agreement</b><span class="badge"><span class="swatch" style="background:${color}"></span>${label}</span></div>
    </div>
  `;
}

function cardHTML(state) {
  if (state.zoho_ticket_id) return zohoCardHTML(state);

  const band = confBand(state.confidence);
  const showClarify = state.status === 'awaiting_clarification';
  const canCorrect = state.status === 'classified' || state.status === 'needs_human_review';

  const threadHTML = (state.conversation || []).map(t =>
    `<div class="qa">${t.role === 'system_question' ? '→ ' : '↳ '}${esc(t.content)}</div>`
  ).join('');

  return `
    <div class="ticket-id">#${state.ticket_id} · ${statusLabel(state.status)}</div>
    <div class="ticket-text" data-original></div>
    ${state.category_id ? `
      ${state.category_group_name ? `<div class="group-label">${esc(state.category_group_name)}</div>` : ''}
      <span class="badge"><span class="swatch" style="background:${band.color}"></span>${esc(state.category_name || state.category_id)}</span>
      ${renderMeter(state.confidence)}
      ${state.reasoning ? `<div class="reasoning">${esc(state.reasoning)}</div>` : ''}
      ${(state.assigned_team || state.poc_primary) ? `
        <div class="routing">
          ${state.assigned_team ? `<div><b>Team</b>${esc(state.assigned_team)}</div>` : ''}
          ${state.poc_primary ? `<div><b>POC</b>${esc(state.poc_primary)}</div>` : ''}
        </div>
      ` : ''}
    ` : ''}
    ${threadHTML ? `<div class="thread">${threadHTML}</div>` : ''}
    ${showClarify ? `
      <div class="clarify">
        <div class="q">${esc(state.clarifying_question || 'Could you provide more detail?')}</div>
        <input type="text" placeholder="Your answer..." />
        <button onclick="respond('${state.ticket_id}', this)">Send answer</button>
      </div>
    ` : ''}
    ${canCorrect ? `
      <div class="correction">
        <label class="field-label">Not right? Correct it</label>
        <select>${categoryOptionsGrouped(state.category_id)}</select>
        <button class="secondary" onclick="correct('${state.ticket_id}', this)">Submit correction</button>
      </div>
    ` : ''}
  `;
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function upsertCard(state) {
  let el = document.getElementById('card-' + state.ticket_id);
  if (!el) {
    if (log.querySelector('.empty')) log.innerHTML = '';
    el = document.createElement('div');
    el.className = 'card';
    el.id = 'card-' + state.ticket_id;
    log.prepend(el);
  }
  el.innerHTML = cardHTML(state);
}

async function respond(ticketId, btnEl) {
  const wrap = btnEl.closest('.clarify');
  const input = wrap.querySelector('input');
  const answer = input.value.trim();
  if (!answer) return;
  btnEl.disabled = true;
  const res = await fetch(`/api/tickets/${ticketId}/respond`, {
    method: 'POST', headers: {'Content-Type':'application/json', ...authHeaders()},
    body: JSON.stringify({ answer })
  });
  const state = await res.json();
  upsertCard(state);
}

async function correct(ticketId, btnEl) {
  const wrap = btnEl.closest('.correction');
  const select = wrap.querySelector('select');
  btnEl.disabled = true;
  const res = await fetch(`/api/tickets/${ticketId}/correct`, {
    method: 'POST', headers: {'Content-Type':'application/json', ...authHeaders()},
    body: JSON.stringify({ corrected_category_id: select.value, corrected_by: 'ui-operator' })
  });
  const state = await res.json();
  upsertCard(state);
}

let currentDate = null; // YYYY-MM-DD (UTC calendar day), set by loadDateOptions()

function todayStr() {
  return new Date().toISOString().slice(0, 10); // UTC, matches the server's day bucketing
}

async function loadDateOptions() {
  const select = document.getElementById('dateSelect');
  const today = todayStr();
  let dates = [today];
  try {
    const res = await fetch('/api/tickets/dates');
    if (res.ok) {
      const data = await res.json();
      dates = Array.from(new Set([today, ...(data.dates || [])])).sort().reverse();
    }
  } catch (e) { console.error(e); }
  select.innerHTML = dates.map(d =>
    `<option value="${d}">${d === today ? `${d} (today)` : d}</option>`
  ).join('');
  select.value = currentDate || today;
}

async function loadDailyTickets() {
  const select = document.getElementById('dateSelect');
  currentDate = select.value || todayStr();
  const summary = document.getElementById('dailySummary');
  summary.innerText = 'loading…';
  try {
    const res = await fetch(`/api/tickets?date=${encodeURIComponent(currentDate)}`);
    if (!res.ok) throw new Error(`failed (${res.status})`);
    const tickets = await res.json();
    log.innerHTML = '';
    if (!tickets.length) {
      log.innerHTML = '<div class="empty">No tickets for this day yet.</div>';
    } else {
      // tickets arrives newest-first, but upsertCard always prepends (shared
      // with the manual-lookup flow) - reverse so the on-screen order still
      // ends up newest-first after each prepend.
      [...tickets].reverse().forEach(state => upsertCard(state));
    }
    const needReview = tickets.filter(t => t.status === 'needs_human_review').length;
    const comparable = tickets.filter(t => t.zoho_agrees !== null && t.zoho_agrees !== undefined);
    const agree = comparable.filter(t => t.zoho_agrees).length;
    summary.innerText = `${tickets.length} ticket${tickets.length === 1 ? '' : 's'}` +
      (needReview ? ` · ${needReview} need review` : '') +
      (comparable.length ? ` · ${agree}/${comparable.length} match Zoho tag` : '');
  } catch (e) {
    summary.innerText = 'failed to load tickets';
    console.error(e);
  }
}

function onDateChange() {
  loadDailyTickets();
}

loadTaxonomy();
loadZohoStatus();
loadDateOptions().then(loadDailyTickets);
</script>
</body>
</html>
