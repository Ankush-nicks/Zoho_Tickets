<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ticket Router</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12151B;
    --panel: #1A1E26;
    --panel-2: #20242E;
    --border: #2B303B;
    --text: #E7EAEE;
    --muted: #8B93A1;
    --accent: #3ED9C4;
    --amber: #F0A857;
    --coral: #E8604C;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
    color-scheme: dark; /* native controls (date picker popover, etc.) render dark to match */
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); line-height:1.5;
    min-height:100vh;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:40px 20px 80px; }

  .masthead{
    display:flex; align-items:flex-start; justify-content:space-between;
    border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:28px;
  }
  .masthead h1{
    font-family:var(--mono); font-size:15px; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase; margin:0;
  }
  .masthead .sub{ font-family:var(--mono); font-size:12px; color:var(--muted); }
  .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:6px; box-shadow:0 0 8px var(--accent); }

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:20px; margin-bottom:20px;
  }
  label.field-label{
    display:block; font-family:var(--mono); font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;
  }
  textarea{
    width:100%; min-height:88px; resize:vertical;
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--sans); font-size:14px; padding:12px;
  }
  textarea:focus, input:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  button{
    font-family:var(--mono); font-size:12px; letter-spacing:.04em; text-transform:uppercase;
    background:var(--accent); color:#0B1411; border:none; border-radius:6px;
    padding:10px 16px; cursor:pointer; font-weight:600;
  }
  button:hover{ filter:brightness(1.08); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  button.secondary{ background:transparent; border:1px solid var(--border); color:var(--text); }

  .row{ display:flex; gap:10px; align-items:center; margin-top:12px; }

  .tab-bar{ display:flex; gap:6px; margin-bottom:20px; }
  .tab-btn{
    background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:8px 16px; border-radius:6px;
  }
  .tab-btn.active{ background:var(--panel-2); color:var(--text); border-color:var(--accent); }
  .tab-btn:hover{ filter:none; color:var(--text); }

  .preset-btn.active{ background:var(--accent); color:#0B1411; border-color:var(--accent); }

  .status-tag-bar{ display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; }
  .status-tag{
    font-family:var(--mono); font-size:11px; letter-spacing:.03em;
    background:var(--panel); border:1px solid var(--border); color:var(--muted);
    padding:6px 12px; border-radius:20px; cursor:pointer;
  }
  .status-tag:hover{ color:var(--text); border-color:var(--muted); }
  .status-tag.active{ background:var(--accent); color:#0B1411; border-color:var(--accent); font-weight:600; }

  .stat-block{ margin-bottom:20px; }
  .stat-block:last-child{ margin-bottom:0; }
  .stat-row{ padding:8px 0; border-bottom:1px solid var(--border); }
  .stat-row:last-child{ border-bottom:none; }
  .stat-label{ font-size:13px; margin-bottom:6px; word-break:break-word; }
  .stat-bar-line{ display:flex; align-items:center; gap:10px; }
  .stat-bar-wrap{ flex:1; height:8px; background:var(--panel-2); border-radius:4px; overflow:hidden; }
  .stat-bar{ height:100%; background:var(--accent); border-radius:4px; }
  .stat-count{ flex:0 0 auto; font-family:var(--mono); font-size:11px; color:var(--muted); min-width:70px; text-align:right; }

  .log{ display:flex; flex-direction:column; gap:14px; }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px;
  }
  .card .ticket-id{ font-family:var(--mono); font-size:11px; color:var(--muted); }
  .card .ticket-text{ margin:6px 0 12px; font-size:14px; }

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    padding:4px 9px; border-radius:20px; border:1px solid var(--border); background:var(--panel-2);
  }
  .badge .swatch{ width:7px; height:7px; border-radius:50%; }

  .meter{ display:flex; gap:3px; margin:10px 0 4px; }
  .meter i{ flex:1; height:6px; border-radius:2px; background:var(--panel-2); }
  .meter i.on{ background:var(--seg-color, var(--accent)); }
  .conf-label{ font-family:var(--mono); font-size:11px; color:var(--muted); }

  .reasoning{ font-size:13px; color:var(--muted); margin-top:10px; }

  .group-label{ font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  .routing{
    display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; padding:10px 12px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    font-size:12px;
  }
  .routing div b{ color:var(--muted); font-weight:500; font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:2px; }

  .clarify{
    margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);
  }
  .clarify .q{ font-size:14px; margin-bottom:8px; }
  .clarify input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--sans); font-size:14px; padding:10px 12px; margin-bottom:8px;
  }

  .correction{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); }
  .correction select{
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--sans); font-size:13px; padding:8px 10px;
  }
  .status-line{ font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:2px; }
  .empty{ color:var(--muted); font-size:13px; font-family:var(--mono); text-align:center; padding:30px 0; }
  .thread{ margin:10px 0; font-size:13px; color:var(--muted); }
  .thread .qa{ margin-bottom:4px; }

  .key-panel input[type=password], .key-panel input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--mono); font-size:13px; padding:10px 12px;
  }
  .key-hint{ font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:8px; }
  .key-panel.saved{ border-color:var(--accent); }
  a.download-link{
    font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--text); text-decoration:none; border:1px solid var(--border); border-radius:6px;
    padding:8px 14px; background:var(--panel);
  }
  a.download-link:hover{ border-color:var(--accent); color:var(--accent); }

  .masthead-right{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
  .masthead-tools{ display:flex; align-items:center; gap:10px; }
  #zohoStatusBadge{ cursor:help; }

  .daily-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .daily-bar .left{ display:flex; align-items:center; gap:8px; }
  .daily-bar input[type=date]{
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--mono); font-size:12px; padding:8px 10px;
  }
  .daily-bar button{ padding:8px 12px; }
  .day-nav-btn{ padding:8px 11px !important; line-height:1; }

  .section-title{
    font-family:var(--mono); font-size:10px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em; margin:0 0 10px;
  }

  .ticket-id-line{ font-family:var(--mono); font-size:11px; color:var(--muted); margin-bottom:10px; }
  .ticket-id-line .mono{ color:var(--text); }
  .category-value{ font-size:14px; margin-bottom:2px; }

  .ticket-details{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); }
  .details-toggle{
    display:flex; align-items:center; gap:6px; width:100%;
    background:transparent; border:none; padding:0; margin:0;
    font-family:var(--mono); font-size:10px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em; cursor:pointer; text-align:left;
  }
  .details-toggle:hover{ color:var(--text); }
  .details-toggle .chevron{ font-size:9px; display:inline-block; transition:transform .15s ease; }
  .details-toggle.open .chevron{ transform:rotate(90deg); }
  .details-body{ margin-top:10px; }
  table.fields{ width:100%; border-collapse:collapse; font-size:13px; }
  table.fields th, table.fields td{
    text-align:left; padding:6px 8px; border-bottom:1px solid var(--border);
    vertical-align:top; word-break:break-word;
  }
  table.fields th{
    font-family:var(--mono); font-size:10px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.04em; width:34%; white-space:nowrap;
  }
  table.fields td{ font-family:var(--mono); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1><span class="dot"></span>Ticket Router</h1>
    <div class="masthead-right">
      <div class="sub">classify &rarr; clarify &rarr; route &rarr; learn &middot; <a href="#" id="logoutLink" onclick="logout(event)" style="color:var(--muted);text-decoration:underline;">log out</a></div>
      <div class="masthead-tools">
        <a class="download-link" href="/api/taxonomy/export.csv" download="taxonomy.csv">&darr; Taxonomy CSV</a>
        <a class="download-link" href="/api/tickets/export.csv" download="tickets_all.csv">&darr; All Tickets CSV</a>
        <span id="zohoStatusBadge" class="badge" title="Zoho credentials live in .env on the server (ZOHO_INVOKE_URL / ZOHO_API_KEY) - there is no in-browser control for them, same as the admin password.">zoho: checking…</span>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabBtn-tickets" onclick="switchTab('tickets')">Tickets</button>
    <button class="tab-btn" id="tabBtn-stats" onclick="switchTab('stats')">Stats</button>
  </div>

  <div id="ticketsView">
  <div class="panel key-panel" id="keyPanel">
    <label class="field-label">OpenAI API key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off" />
    <div class="row">
      <button id="saveKeyBtn" onclick="saveApiKey()">Save key</button>
      <button class="secondary" id="clearKeyBtn" onclick="clearApiKey()">Clear</button>
      <span id="keyStatus" class="status-line"></span>
    </div>
    <div class="key-hint">Stored only in this browser's local storage, sent directly with each request - never written to the server.</div>
  </div>

  <div class="panel daily-bar">
    <div class="left">
      <button class="secondary day-nav-btn" onclick="shiftDate(-1)" title="Previous day">&lsaquo;</button>
      <input type="date" id="dateInput" onchange="onDateChange()" />
      <button class="secondary day-nav-btn" onclick="shiftDate(1)" title="Next day">&rsaquo;</button>
      <button class="secondary" onclick="jumpToday()">Today</button>
      <button class="secondary day-nav-btn" onclick="loadDailyTickets()" title="Refresh">&#8635;</button>
      <a class="download-link" id="exportDayLink" href="/api/tickets/export.csv" download="tickets_day.csv">&darr; This Day CSV</a>
    </div>
    <div id="dailySummary" class="status-line"></div>
  </div>

  <div id="statusTagBar" class="status-tag-bar"></div>

  <div id="log" class="log">
    <div class="empty">Loading today's tickets…</div>
  </div>
  </div>

  <div id="statsView" style="display:none;">
    <div class="panel daily-bar">
      <div class="left">
        <button class="secondary preset-btn" id="presetBtn-today" onclick="setStatsPreset('today')">Today</button>
        <button class="secondary preset-btn" id="presetBtn-7d" onclick="setStatsPreset('7d')">7 Days</button>
        <button class="secondary preset-btn" id="presetBtn-30d" onclick="setStatsPreset('30d')">30 Days</button>
        <button class="secondary preset-btn" id="presetBtn-all" onclick="setStatsPreset('all')">All Time</button>
        <input type="date" id="statsFromInput" onchange="onStatsCustomChange()" />
        <span class="status-line">to</span>
        <input type="date" id="statsToInput" onchange="onStatsCustomChange()" />
      </div>
      <div id="statsSummary" class="status-line"></div>
    </div>
    <div id="statsBlocks"></div>
  </div>
</div>

<script>
const API_KEY_STORAGE_KEY = 'ticketRouterOpenAIKey';
let groups = [];
let leafMap = {}; // subcategory id -> { name, groupId, groupName }
const log = document.getElementById('log');

function getApiKey() {
  return localStorage.getItem(API_KEY_STORAGE_KEY) || '';
}

function authHeaders() {
  const key = getApiKey();
  return key ? { 'X-OpenAI-Api-Key': key } : {};
}

function refreshKeyPanel() {
  const key = getApiKey();
  const panel = document.getElementById('keyPanel');
  const input = document.getElementById('apiKeyInput');
  if (key) {
    input.value = key;
    panel.classList.add('saved');
  } else {
    panel.classList.remove('saved');
  }
}

function saveApiKey() {
  const input = document.getElementById('apiKeyInput');
  const status = document.getElementById('keyStatus');
  const key = input.value.trim();
  if (!key) { status.innerText = 'enter a key first'; setTimeout(() => status.innerText = '', 2000); return; }
  localStorage.setItem(API_KEY_STORAGE_KEY, key);
  refreshKeyPanel();
  status.innerText = 'saved';
  setTimeout(() => status.innerText = '', 2000);
}

function clearApiKey() {
  localStorage.removeItem(API_KEY_STORAGE_KEY);
  document.getElementById('apiKeyInput').value = '';
  refreshKeyPanel();
}

refreshKeyPanel();

async function logout(e) {
  e.preventDefault();
  await fetch('/api/logout', { method: 'POST' });
  window.location = '/login';
}

async function loadTaxonomy() {
  const res = await fetch('/api/taxonomy');
  const data = await res.json();
  groups = data.categories;
  leafMap = {};
  groups.forEach(g => {
    (g.subcategories || []).forEach(s => {
      leafMap[s.id] = { name: s.name, groupId: g.id, groupName: g.name };
    });
  });
}

async function loadZohoStatus() {
  const el = document.getElementById('zohoStatusBadge');
  try {
    const res = await fetch('/api/zoho/status');
    if (!res.ok) throw new Error(`status ${res.status}`);
    const data = await res.json();
    const isSample = data.invoke_url_is_sample || data.api_key_is_sample;
    const color = isSample ? 'var(--amber)' : 'var(--accent)';
    const label = isSample ? 'zoho: sample/mock config' : 'zoho: configured';
    el.innerHTML = `<span class="swatch" style="background:${color}"></span>${label}`;
  } catch (e) {
    el.innerHTML = `<span class="swatch" style="background:var(--coral)"></span>zoho: status unknown`;
    console.error(e);
  }
}

function confBand(c) {
  if (c === null || c === undefined) return { color: 'var(--muted)', segs: 0 };
  if (c < 0.4) return { color: 'var(--coral)', segs: Math.max(1, Math.round(c * 5)) };
  if (c < 0.65) return { color: 'var(--amber)', segs: Math.round(c * 5) };
  return { color: 'var(--accent)', segs: Math.round(c * 5) };
}

function categoryName(id) {
  return leafMap[id] ? leafMap[id].name : id;
}

function renderMeter(confidence) {
  const band = confBand(confidence);
  let segs = '';
  for (let i = 0; i < 5; i++) {
    segs += `<i class="${i < band.segs ? 'on' : ''}" style="--seg-color:${band.color}"></i>`;
  }
  return `<div class="meter">${segs}</div><div class="conf-label">confidence ${confidence !== null && confidence !== undefined ? confidence.toFixed(2) : '—'}</div>`;
}

function statusLabel(status) {
  return {
    classified: 'Routed',
    awaiting_clarification: 'Awaiting clarification',
    needs_human_review: 'Needs human review',
    corrected: 'Corrected',
  }[status] || status;
}

function categoryOptionsGrouped(selectedId) {
  return groups.map(g => {
    const opts = (g.subcategories || []).map(s =>
      `<option value="${s.id}" ${s.id === selectedId ? 'selected' : ''}>${esc(s.name)}</option>`
    ).join('');
    return `<optgroup label="${esc(g.name)}">${opts}</optgroup>`;
  }).join('');
}

function clarifyHTML(state) {
  return `
    <div class="clarify">
      <div class="q">${esc(state.clarifying_question || 'Could you provide more detail?')}</div>
      <input type="text" placeholder="Your answer..." />
      <button onclick="respond('${state.ticket_id}', this)">Send answer</button>
    </div>
  `;
}

function correctionHTML(state) {
  return `
    <div class="correction">
      <label class="field-label">Not right? Correct it</label>
      <select>${categoryOptionsGrouped(state.category_id)}</select>
      <button class="secondary" onclick="correct('${state.ticket_id}', this)">Submit correction</button>
    </div>
  `;
}

function zohoCardHTML(state) {
  const band = confBand(state.confidence);
  const showClarify = state.status === 'awaiting_clarification';
  const canCorrect = state.status === 'classified' || state.status === 'needs_human_review';

  const threadHTML = (state.conversation || []).map(t =>
    `<div class="qa">${t.role === 'system_question' ? '→ ' : '↳ '}${esc(t.content)}</div>`
  ).join('');

  return `
    <div class="ticket-id-line">Ticket ID: <span class="mono">${esc(state.zoho_ticket_id)}</span> &middot; ${statusLabel(state.status)}</div>

    ${state.category_id ? `
      <div class="field-label">Category</div>
      <div class="category-value">${esc(state.category_group_name || '—')}</div>
      <div class="field-label" style="margin-top:12px;">Sub-category</div>
      <span class="badge"><span class="swatch" style="background:${band.color}"></span>${esc(state.category_name || state.category_id)}</span>
      ${renderMeter(state.confidence)}
      ${state.reasoning ? `<div class="reasoning">${esc(state.reasoning)}</div>` : ''}
      ${(state.assigned_team || state.poc_primary) ? `
        <div class="routing">
          ${state.assigned_team ? `<div><b>Team</b>${esc(state.assigned_team)}</div>` : ''}
          ${state.poc_primary ? `<div><b>POC</b>${esc(state.poc_primary)}</div>` : ''}
        </div>
      ` : ''}
    ` : '<div class="reasoning">Not yet classified.</div>'}
    ${zohoAgreementHTML(state)}
    ${threadHTML ? `<div class="thread">${threadHTML}</div>` : ''}
    ${showClarify ? clarifyHTML(state) : ''}
    ${canCorrect ? correctionHTML(state) : ''}

    <div class="ticket-details">
      <button class="details-toggle" onclick="toggleDetails('${state.ticket_id}', this)">
        <span class="chevron">&#9656;</span> Ticket Details (${ticketDetailsFieldCount(state)})
      </button>
      <div class="details-body" id="details-${state.ticket_id}" style="display:none;">
        ${ticketDetailsHTML(state)}
      </div>
    </div>
  `;
}

function toggleDetails(ticketId, btnEl) {
  const body = document.getElementById('details-' + ticketId);
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'block';
  btnEl.classList.toggle('open', !isOpen);
}

// Walks the raw Zoho payload at any depth/shape into a flat list of
// [path, value] pairs so every field that came in is visible, regardless
// of how it's nested - same approach the old zoho-debug page used.
function flattenObj(node, path, out) {
  if (node !== null && typeof node === 'object' && !Array.isArray(node)) {
    const keys = Object.keys(node);
    if (keys.length === 0) out.push([path || '(root)', '{}']);
    for (const k of keys) flattenObj(node[k], path ? `${path}.${k}` : k, out);
  } else if (Array.isArray(node)) {
    if (node.length === 0) out.push([path || '(root)', '[]']);
    node.forEach((item, i) => flattenObj(item, `${path}[${i}]`, out));
  } else {
    out.push([path || '(root)', node]);
  }
  return out;
}

function fieldLabelFromKey(key) {
  return key.replace(/\[\d+\]/g, '').split(/[._]/).filter(Boolean)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function ticketDetailsFieldCount(state) {
  return state.raw_payload ? flattenObj(state.raw_payload, '', []).length : 1;
}

function ticketDetailsHTML(state) {
  if (!state.raw_payload) {
    return `<table class="fields"><tr><th>Issue In Detail</th><td>${esc(state.issue_in_detail || '—')}</td></tr></table>`;
  }
  const rows = flattenObj(state.raw_payload, '', []).map(([k, v]) =>
    `<tr><th>${esc(fieldLabelFromKey(k))}</th><td>${esc(v)}</td></tr>`
  ).join('');
  return `<table class="fields">${rows}</table>`;
}

function zohoAgreementHTML(state) {
  const zohoTag = state.zoho_subcategory || state.zoho_category;
  if (!zohoTag) return '';
  if (state.zoho_agrees === null || state.zoho_agrees === undefined) return '';
  const color = state.zoho_agrees ? 'var(--accent)' : 'var(--coral)';
  const label = state.zoho_agrees ? 'matches Zoho tag' : 'differs from Zoho tag';
  return `
    <div class="routing" style="margin-top:8px;">
      <div><b>Zoho tag</b>${esc(zohoTag)}</div>
      <div><b>Agreement</b><span class="badge"><span class="swatch" style="background:${color}"></span>${label}</span></div>
    </div>
  `;
}

function cardHTML(state) {
  if (state.zoho_ticket_id) return zohoCardHTML(state);

  const band = confBand(state.confidence);
  const showClarify = state.status === 'awaiting_clarification';
  const canCorrect = state.status === 'classified' || state.status === 'needs_human_review';

  const threadHTML = (state.conversation || []).map(t =>
    `<div class="qa">${t.role === 'system_question' ? '→ ' : '↳ '}${esc(t.content)}</div>`
  ).join('');

  return `
    <div class="ticket-id">#${state.ticket_id} · ${statusLabel(state.status)}</div>
    <div class="ticket-text" data-original></div>
    ${state.category_id ? `
      ${state.category_group_name ? `<div class="group-label">${esc(state.category_group_name)}</div>` : ''}
      <span class="badge"><span class="swatch" style="background:${band.color}"></span>${esc(state.category_name || state.category_id)}</span>
      ${renderMeter(state.confidence)}
      ${state.reasoning ? `<div class="reasoning">${esc(state.reasoning)}</div>` : ''}
      ${(state.assigned_team || state.poc_primary) ? `
        <div class="routing">
          ${state.assigned_team ? `<div><b>Team</b>${esc(state.assigned_team)}</div>` : ''}
          ${state.poc_primary ? `<div><b>POC</b>${esc(state.poc_primary)}</div>` : ''}
        </div>
      ` : ''}
    ` : ''}
    ${threadHTML ? `<div class="thread">${threadHTML}</div>` : ''}
    ${showClarify ? `
      <div class="clarify">
        <div class="q">${esc(state.clarifying_question || 'Could you provide more detail?')}</div>
        <input type="text" placeholder="Your answer..." />
        <button onclick="respond('${state.ticket_id}', this)">Send answer</button>
      </div>
    ` : ''}
    ${canCorrect ? `
      <div class="correction">
        <label class="field-label">Not right? Correct it</label>
        <select>${categoryOptionsGrouped(state.category_id)}</select>
        <button class="secondary" onclick="correct('${state.ticket_id}', this)">Submit correction</button>
      </div>
    ` : ''}
  `;
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function upsertCard(state) {
  let el = document.getElementById('card-' + state.ticket_id);
  if (!el) {
    if (log.querySelector('.empty')) log.innerHTML = '';
    el = document.createElement('div');
    el.className = 'card';
    el.id = 'card-' + state.ticket_id;
    log.prepend(el);
  }
  el.innerHTML = cardHTML(state);
}

async function respond(ticketId, btnEl) {
  const wrap = btnEl.closest('.clarify');
  const input = wrap.querySelector('input');
  const answer = input.value.trim();
  if (!answer) return;
  btnEl.disabled = true;
  const res = await fetch(`/api/tickets/${ticketId}/respond`, {
    method: 'POST', headers: {'Content-Type':'application/json', ...authHeaders()},
    body: JSON.stringify({ answer })
  });
  const state = await res.json();
  upsertCard(state);
}

async function correct(ticketId, btnEl) {
  const wrap = btnEl.closest('.correction');
  const select = wrap.querySelector('select');
  btnEl.disabled = true;
  const res = await fetch(`/api/tickets/${ticketId}/correct`, {
    method: 'POST', headers: {'Content-Type':'application/json', ...authHeaders()},
    body: JSON.stringify({ corrected_category_id: select.value, corrected_by: 'ui-operator' })
  });
  const state = await res.json();
  upsertCard(state);
}

let currentDate = todayStr(); // YYYY-MM-DD (UTC calendar day)

function todayStr() {
  return new Date().toISOString().slice(0, 10); // UTC, matches the server's day bucketing
}

function addDaysUTC(dateStr, deltaDays) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + deltaDays);
  return dt.toISOString().slice(0, 10);
}

function shiftDate(deltaDays) {
  document.getElementById('dateInput').value = addDaysUTC(currentDate, deltaDays);
  loadDailyTickets();
}

function jumpToday() {
  document.getElementById('dateInput').value = todayStr();
  loadDailyTickets();
}

let currentDayTickets = [];
let activeStatusTag = 'all';
let statusTagKeys = [];

// Zoho's own workflow status (ticket_status in raw_payload) - separate
// from this app's classification status. null when unset/not a Zoho ticket.
function ticketZohoStatus(t) {
  const v = t.raw_payload && t.raw_payload.ticket_status;
  return v ? String(v).trim() : null;
}

function renderStatusTagBar() {
  const bar = document.getElementById('statusTagBar');
  if (!currentDayTickets.length) { bar.innerHTML = ''; return; }

  const counts = {};
  currentDayTickets.forEach(t => {
    const s = ticketZohoStatus(t) || '(not set)';
    counts[s] = (counts[s] || 0) + 1;
  });
  statusTagKeys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

  let html = `<button class="status-tag ${activeStatusTag === 'all' ? 'active' : ''}" onclick="setStatusTag('all')">All (${currentDayTickets.length})</button>`;
  // index-based onclick, not the raw tag text - ticket_status comes from
  // Zoho and shouldn't be interpolated directly into an inline JS string.
  statusTagKeys.forEach((tag, i) => {
    html += `<button class="status-tag ${activeStatusTag === tag ? 'active' : ''}" onclick="setStatusTagByIndex(${i})">${esc(tag)} (${counts[tag]})</button>`;
  });
  bar.innerHTML = html;
}

function setStatusTagByIndex(i) {
  setStatusTag(statusTagKeys[i]);
}

function setStatusTag(tag) {
  activeStatusTag = tag;
  renderStatusTagBar();
  renderFilteredTickets();
}

function renderFilteredTickets() {
  const filtered = activeStatusTag === 'all'
    ? currentDayTickets
    : currentDayTickets.filter(t => (ticketZohoStatus(t) || '(not set)') === activeStatusTag);
  log.innerHTML = '';
  if (!filtered.length) {
    log.innerHTML = `<div class="empty">${currentDayTickets.length ? 'No tickets match this filter.' : 'No tickets for this day yet.'}</div>`;
  } else {
    // newest-first, but upsertCard always prepends - reverse so the
    // on-screen order still ends up newest-first after each prepend.
    [...filtered].reverse().forEach(state => upsertCard(state));
  }
}

async function loadDailyTickets() {
  const input = document.getElementById('dateInput');
  currentDate = input.value || todayStr();
  input.value = currentDate;
  document.getElementById('exportDayLink').href = `/api/tickets/export.csv?date=${encodeURIComponent(currentDate)}`;
  document.getElementById('exportDayLink').download = `tickets_${currentDate}.csv`;
  const summary = document.getElementById('dailySummary');
  summary.innerText = 'loading…';
  try {
    const res = await fetch(`/api/tickets?date=${encodeURIComponent(currentDate)}`);
    if (!res.ok) throw new Error(`failed (${res.status})`);
    currentDayTickets = await res.json();
    activeStatusTag = 'all';
    renderStatusTagBar();
    renderFilteredTickets();

    const needReview = currentDayTickets.filter(t => t.status === 'needs_human_review').length;
    const comparable = currentDayTickets.filter(t => t.zoho_agrees !== null && t.zoho_agrees !== undefined);
    const agree = comparable.filter(t => t.zoho_agrees).length;
    summary.innerText = `${currentDayTickets.length} ticket${currentDayTickets.length === 1 ? '' : 's'}` +
      (needReview ? ` · ${needReview} need review` : '') +
      (comparable.length ? ` · ${agree}/${comparable.length} match Zoho tag` : '');
  } catch (e) {
    summary.innerText = 'failed to load tickets';
    console.error(e);
  }
}

function onDateChange() {
  loadDailyTickets();
}

let statsLoadedOnce = false;

function switchTab(tab) {
  document.getElementById('ticketsView').style.display = tab === 'tickets' ? '' : 'none';
  document.getElementById('statsView').style.display = tab === 'stats' ? '' : 'none';
  document.getElementById('tabBtn-tickets').classList.toggle('active', tab === 'tickets');
  document.getElementById('tabBtn-stats').classList.toggle('active', tab === 'stats');
  if (tab === 'stats' && !statsLoadedOnce) {
    statsLoadedOnce = true;
    setStatsPreset('7d');
  }
}

function highlightStatsPreset(active) {
  ['today', '7d', '30d', 'all'].forEach(p =>
    document.getElementById('presetBtn-' + p).classList.toggle('active', p === active)
  );
}

function setStatsPreset(preset) {
  const today = todayStr();
  let from = null, to = null;
  if (preset === 'today') { from = today; to = today; }
  else if (preset === '7d') { from = addDaysUTC(today, -6); to = today; }
  else if (preset === '30d') { from = addDaysUTC(today, -29); to = today; }
  document.getElementById('statsFromInput').value = from || '';
  document.getElementById('statsToInput').value = to || '';
  highlightStatsPreset(preset);
  loadStats(from, to);
}

function onStatsCustomChange() {
  const from = document.getElementById('statsFromInput').value || null;
  const to = document.getElementById('statsToInput').value || null;
  highlightStatsPreset(null);
  loadStats(from, to);
}

function statBlockHTML(title, hint, entries, total) {
  const rows = entries.map(([label, count]) => {
    const pct = total ? Math.round((count / total) * 100) : 0;
    return `
      <div class="stat-row">
        <div class="stat-label">${esc(label)}</div>
        <div class="stat-bar-line">
          <div class="stat-bar-wrap"><div class="stat-bar" style="width:${pct}%"></div></div>
          <div class="stat-count">${count} (${pct}%)</div>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="panel stat-block">
      <div class="section-title">${esc(title)}${hint ? ` <span style="text-transform:none;letter-spacing:normal;">&mdash; ${esc(hint)}</span>` : ''}</div>
      ${rows || '<div class="empty" style="padding:10px 0;">No data for this period.</div>'}
    </div>`;
}

async function loadStats(dateFrom, dateTo) {
  const summary = document.getElementById('statsSummary');
  const blocks = document.getElementById('statsBlocks');
  summary.innerText = 'loading…';
  const params = new URLSearchParams();
  if (dateFrom) params.set('date_from', dateFrom);
  if (dateTo) params.set('date_to', dateTo);
  try {
    const res = await fetch(`/api/stats?${params.toString()}`);
    if (!res.ok) throw new Error(`failed (${res.status})`);
    const data = await res.json();
    summary.innerText = `${data.total_tickets} ticket${data.total_tickets === 1 ? '' : 's'}`;

    const statusEntries = Object.entries(data.by_status)
      .map(([k, v]) => [statusLabel(k), v]).sort((a, b) => b[1] - a[1]);
    const zohoStatusEntries = Object.entries(data.by_zoho_status);
    const categoryEntries = data.by_category.map(c => [`${c.group} / ${c.subcategory}`, c.count]);
    const priorityEntries = Object.entries(data.by_priority);
    const teamEntries = Object.entries(data.by_assigned_team);

    blocks.innerHTML =
      statBlockHTML('By Classification Status', 'this app\'s own routing state', statusEntries, data.total_tickets) +
      statBlockHTML('By Zoho Ticket Status', 'whether it\'s been picked up / actioned in Zoho', zohoStatusEntries, data.total_tickets) +
      statBlockHTML('By Category', null, categoryEntries, data.total_tickets) +
      statBlockHTML('By Priority', null, priorityEntries, data.total_tickets) +
      statBlockHTML('By Assigned Team', null, teamEntries, data.total_tickets);
  } catch (e) {
    summary.innerText = 'failed to load stats';
    console.error(e);
  }
}

loadTaxonomy();
loadZohoStatus();
document.getElementById('dateInput').value = currentDate;
loadDailyTickets();
</script>
