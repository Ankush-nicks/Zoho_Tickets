<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="brand-row">
      <span class="brand-dot"></span>
      <h1>Ticket Router</h1>
      <span class="as-of" id="asOf"></span>
    </div>
    <div class="poc-row">
      <span class="poc-name" id="pocName"></span>
      <span class="poc-team" id="pocTeam"></span>
      <span class="poc-count" id="pocCount"></span>
    </div>
  </header>

  <div class="view-tabs" id="viewTabs">
    <button class="view-tab active" data-view="queue">Queue</button>
    <button class="view-tab" data-view="heatgrid">Heat Grid</button>
  </div>

  <div id="queueView" class="view">
    <div id="summary" class="summary-row"></div>

    <div class="sort-row">
      <span class="sort-label">Sort</span>
      <div class="sort-tabs" id="sortTabs">
        <button class="sort-tab active" data-sort="risk">Risk</button>
        <button class="sort-tab" data-sort="priority">Priority</button>
        <button class="sort-tab" data-sort="sla">SLA left</button>
      </div>
    </div>

    <div id="list" class="ticket-list"><div class="empty-state">Loading&hellip;</div></div>
  </div>

  <div id="heatgridView" class="view" hidden>
    <div class="heat-controls">
      <select id="categorySelect" class="category-select"></select>
      <span id="categoryTotal" class="category-total"></span>
    </div>

    <div class="heat-legend" id="heatLegend"></div>

    <div id="heatGrid" class="heat-grid"><div class="empty-state">Loading&hellip;</div></div>

    <div id="heatDetail" class="heat-detail"></div>
  </div>

  <script src="config.js"></script>
  <script src="sidepanel.js"></script>
  <script src="heatgrid.js"></script>
</body>
</html>
